name: Publish prices.json for polling

# Serves the same payload the webhook receives as a static JSON file on
# GitHub Pages, so a TRMNL plugin using the Polling strategy (or anyone
# else) can read it without holding a plugin UUID.
#
# Endpoint: https://<owner>.github.io/<repo>/prices.json

on:
  schedule:
    # Same cadence as the webhook push: keeps the "Now" slot moving.
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-json
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build payload
        env:
          # Override with a repository variable to publish Spain instead.
          OMIE_AREA: ${{ vars.OMIE_AREA || 'PT' }}
        run: |
          bash run.sh trmnl --area "${OMIE_AREA}" --out dist/prices.json
          test -s dist/prices.json

      - name: Deploy to gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd dist
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "prices: $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -f \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            gh-pages
