name: Publish prices.json for polling

# Serves the webhook payload as static JSON, so a TRMNL plugin on the Polling
# strategy -- or anything else -- can read it without a plugin UUID.
#
# Branch root: prices-pt.json, prices-es.json, .nojekyll, and CNAME when
# trmnl/polling/CNAME exists. This branch is workflow-owned: every run
# force-pushes, so do not keep other files there.

on:
  schedule:
    # Same cadence as the webhook push: keeps the "Now" slot moving.
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-json
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build payloads
        run: |
          set -euo pipefail
          mkdir -p dist
          # Both areas are built every run from the same OMIE files. One extra
          # fetch beats leaving a stale file behind after an area switch, and
          # each area gets its own path so one never overwrites the other.
          for AREA in PT ES; do
            LOWER="$(printf '%s' "$AREA" | tr '[:upper:]' '[:lower:]')"
            bash run.sh trmnl --area "$AREA" --max-age-min 45 \
              --out "dist/prices-${LOWER}.json"
            test -s "dist/prices-${LOWER}.json"
          done
          if [ -f trmnl/polling/CNAME ]; then
            cp trmnl/polling/CNAME dist/CNAME
          fi

      - name: Deploy to gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd dist
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "prices: $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -f \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            gh-pages

      - name: Verify the polling URL serves this run's payload
        env:
          POLLING_URL: ${{ vars.POLLING_URL }}
        run: |
          set -euo pipefail
          if [ -z "${POLLING_URL}" ]; then
            echo "::notice::Set the repository variable POLLING_URL to have this job verify the published endpoint."
            exit 0
          fi
          built="$(python3 -c 'import json;print(json.load(open("dist/prices-pt.json"))["updated_at"])')"
          served=""
          for _ in $(seq 1 12); do
            served="$(curl -fsSL --max-time 20 "${POLLING_URL}" \
              | python3 -c 'import json,sys;print(json.load(sys.stdin).get("updated_at",""))' 2>/dev/null || true)"
            if [ "${served}" = "${built}" ]; then
              echo "Endpoint serving this run's payload (${built})."
              exit 0
            fi
            sleep 10
          done
          echo "::error::${POLLING_URL} does not serve this run's payload (built ${built}, last served '${served}'). Pages may be disabled, not yet built, or serving another host/path."
          exit 1
