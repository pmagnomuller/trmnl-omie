name: Publish prices.json for polling

# Serves the webhook payload as static JSON, so a TRMNL plugin on the Polling
# strategy -- or anything else -- can read it without a plugin UUID.
#
# Branch root: prices-pt.json, prices-es.json, .nojekyll, and CNAME when
# trmnl/polling/CNAME exists. This branch is workflow-owned: every run
# force-pushes, so do not keep other files there. GitHub Pages serves it at
# https://www.pedro-muller.com/trmnl-omie/ (the account custom domain; every
# github.io path 301-redirects there). Alternative hosts: trmnl/polling/HOSTING.md.

on:
  schedule:
    # Same cadence as the webhook push: keeps the "Now" slot moving.
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-json
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build payloads
        env:
          # Set the repository variable ENVELOPE=1 if the polling merge wants
          # the webhook body shape; adds prices-<area>-envelope.json files.
          ENVELOPE: ${{ vars.ENVELOPE }}
        run: |
          set -euo pipefail
          mkdir -p dist
          # Both areas are built every run from the same OMIE files, so one extra
          # fetch beats leaving a stale file behind after an area switch, and
          # each area gets its own path so one never overwrites the other.
          # set -e aborts the loop at the first failure: an ES-only problem
          # (parse gap, network) blocks the PT file too. Deliberate: the pair
          # stays consistent. Cost is availability, never a mismatched pair.
          for AREA in PT ES; do
            LOWER="$(printf '%s' "$AREA" | tr '[:upper:]' '[:lower:]')"
            bash run.sh trmnl --area "$AREA" --max-age-min 45 \
              --out "dist/prices-${LOWER}.json"
            test -s "dist/prices-${LOWER}.json"
            if [ "${ENVELOPE:-}" = "1" ]; then
              bash run.sh trmnl --area "$AREA" --max-age-min 45 --envelope \
                --out "dist/prices-${LOWER}-envelope.json"
              test -s "dist/prices-${LOWER}-envelope.json"
            fi
          done
          # CNAME is opt-in and only for hosts that need it. This account's
          # custom domain already serves project paths, so it is normally absent.
          if [ -f trmnl/polling/CNAME ]; then
            if grep -Eq '^[A-Za-z0-9.-]+$' trmnl/polling/CNAME; then
              cp trmnl/polling/CNAME dist/CNAME
            else
              echo "::warning::trmnl/polling/CNAME is not a bare hostname; ignored."
            fi
          fi

      - name: Deploy to gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd dist
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "prices: $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -f \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            gh-pages

      - name: Verify the polling URL serves this run's payload
        env:
          POLLING_URL: ${{ vars.POLLING_URL }}
        run: |
          set -euo pipefail
          if [ -z "${POLLING_URL}" ]; then
            echo "::notice::Set the repository variable POLLING_URL to have this job verify the published endpoint."
            exit 0
          fi
          # Compare against the file the URL names. Exact filename, never a
          # glob: `*es*` also matches prices-pt.json ("pric-es"), which compared
          # the ES payload against the PT endpoint and reddened every run.
          NAME="$(basename "${POLLING_URL%%\?*}")"
          FILE="dist/${NAME}"
          if [ ! -s "${FILE}" ]; then
            echo "::notice::No dist/${NAME} in this run; comparing against dist/prices-pt.json."
            FILE=dist/prices-pt.json
          fi
          if [ ! -s "${FILE}" ]; then
            echo "::error::Neither dist/${NAME} nor dist/prices-pt.json exists in this run."
            exit 1
          fi
          built="$(python3 -c 'import json,sys;d=json.load(open(sys.argv[1]));d=d.get("merge_variables",d);print(d["updated_at"])' "${FILE}")"
          served=""
          for attempt in $(seq 1 20); do
            served="$(curl -fsSL --max-time 20 "${POLLING_URL}" \
              | python3 -c 'import json,sys;d=json.load(sys.stdin);d=d.get("merge_variables",d);print(d.get("updated_at",""))' 2>/dev/null || true)"
            if [ "${served}" = "${built}" ]; then
              echo "Endpoint serving this run's payload (${built})."
              exit 0
            fi
            if [ "${attempt}" -lt 20 ]; then sleep 15; fi
          done
          echo "::error::${POLLING_URL} does not serve this run's payload (built ${built}, last served '${served}'). Pages may be disabled, not yet built, or serving another host/path."
          exit 1
