name: TRMNL OMIE PT prices

on:
  schedule:
    # Refresh current slot / cheap window every 15 minutes.
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Push day-ahead prices to TRMNL
        env:
          # Set the repository variable OMIE_AREA to ES to push Spain instead.
          OMIE_AREA: ${{ vars.OMIE_AREA || 'PT' }}
          TRMNL_PLUGIN_UUID: ${{ secrets.TRMNL_PLUGIN_UUID }}
        run: |
          if [ -z "${TRMNL_PLUGIN_UUID}" ]; then
            echo "TRMNL_PLUGIN_UUID secret is not set" >&2
            exit 1
          fi
          bash run.sh trmnl --area "${OMIE_AREA}" --max-age-min 45 --push
